[project]
name = "toolforge-mcp"
version = "0.1.0"
description = "A governed reusable Python tool registry for AI agents over MCP."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ThisIsCKM-org" }]
dependencies = [
  "fastmcp>=2.0.0",
  "pydantic>=2.0.0",
  "sentence-transformers>=2.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pillow>=10.0.0", "pypdf>=4.0.0", "jsonschema>=4.0.0"]

[project.scripts]
toolforge-mcp = "toolforge.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
